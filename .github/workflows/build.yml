name: Build PonWrt for XG-040G-MD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'configs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone pbs05/ponwrt
        run: |
          git clone --depth=1 https://github.com/pbs05/ponwrt.git ponwrt

      - name: Update and install feeds
        run: |
          cd ponwrt
          ./scripts/feeds update -a
          mkdir -p package/custom
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git package/custom/luci-theme-aurora
          ./scripts/feeds install -a

      - name: Configure device build
        run: |
          cp configs/xg-040g-md.config ponwrt/.config
          cd ponwrt
          make defconfig

      - name: Download sources and compile firmware
        run: |
          cd ponwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg-040g-md
          path: ponwrt/bin/targets/airoha/an7581/*
          if-no-files-found: warn
