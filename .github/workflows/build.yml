name: Build PonWrt for XG-040G-MD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'configs/**'
      - 'files/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone pbs05/ponwrt
        run: |
          git clone --depth=1 https://github.com/pbs05/ponwrt.git ponwrt

      - name: Update feeds and add custom packages
        run: |
          cd ponwrt
          ./scripts/feeds update -a

          mkdir -p package/custom
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git package/custom/luci-theme-aurora
          git clone --depth=1 https://github.com/sirpdboy/luci-app-ddns-go.git package/custom/luci-app-ddns-go
          git clone --depth=1 https://github.com/stackia/rtp2httpd.git package/custom/rtp2httpd

          if ! find feeds/ -maxdepth 4 -name "luci-app-arpbind" | grep -q .; then
            git clone --depth=1 --filter=blob:none --sparse https://github.com/immortalwrt/luci.git /tmp/imm-luci
            git -C /tmp/imm-luci sparse-checkout set applications/luci-app-arpbind
            mv /tmp/imm-luci/applications/luci-app-arpbind package/custom/
            rm -rf /tmp/imm-luci
          fi

          ./scripts/feeds install -a

      - name: Apply custom files and device config
        run: |
          mkdir -p ponwrt/files
          if [ -d files ] && [ "$(ls -A files)" ]; then
            cp -r files/* ponwrt/files/
          fi
          cp configs/xg-040g-md.config ponwrt/.config
          cd ponwrt
          make defconfig
          grep -E "luci-theme-aurora|ttyd|filemanager|wol|wireguard|arpbind|ddns-go|rtp2httpd|miniupnpd-nftables|upnp" .config || true

      - name: Download sources and compile firmware
        run: |
          cd ponwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg-040g-md
          path: ponwrt/bin/targets/airoha/an7581/*
          if-no-files-found: warn
